services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    command: ["postgres", "-c", "hnsw.ef_search=64"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videosearch}
      POSTGRES_USER: ${POSTGRES_USER:-videosearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videosearch} -d ${POSTGRES_DB:-videosearch}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - home-infra

  ingestion-worker:
    build: ./services/ingestion-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-videosearch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-videosearch}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_VIDEOS: ${MINIO_BUCKET_VIDEOS:-videos}
      MINIO_BUCKET_FRAMES: ${MINIO_BUCKET_FRAMES:-frames}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      YOLO_MODEL: ${YOLO_MODEL:-yolov8n.pt}
      YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.35}
      YOLO_CLASSES: ${YOLO_CLASSES:-person,bicycle,car,motorcycle,bus,truck,cat,dog,horse,sheep,cow,bird}
      YOLO_BATCH_SIZE: ${YOLO_BATCH_SIZE:-8}
      FACE_MATCH_HIGH_THRESHOLD: ${FACE_MATCH_HIGH_THRESHOLD:-0.65}
      FACE_MATCH_LOW_THRESHOLD: ${FACE_MATCH_LOW_THRESHOLD:-0.50}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${WORKER_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 5g
    networks:
      - home-infra

  watcher:
    build: ./services/watcher
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_VIDEOS: ${MINIO_BUCKET_VIDEOS:-videos}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      WATCH_DIR: /watch
      WORKER_URL: http://ingestion-worker:8001
      WATCH_USE_POLLING: ${WATCH_USE_POLLING:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${WATCH_FOLDER:-/data/videos}:/watch:ro
    depends_on:
      ingestion-worker:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    networks:
      - home-infra

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-videosearch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-videosearch}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_VIDEOS: ${MINIO_BUCKET_VIDEOS:-videos}
      MINIO_BUCKET_FRAMES: ${MINIO_BUCKET_FRAMES:-frames}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      API_TOKEN: ${API_TOKEN}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:8080}
      FACE_MATCH_HIGH_THRESHOLD: ${FACE_MATCH_HIGH_THRESHOLD:-0.65}
      FACE_MATCH_LOW_THRESHOLD: ${FACE_MATCH_LOW_THRESHOLD:-0.50}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CLUSTER_MIN_SIZE: ${CLUSTER_MIN_SIZE:-5}
      CLUSTER_MIN_SAMPLES: ${CLUSTER_MIN_SAMPLES:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - home-infra

  web:
    build: ./services/web
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - home-infra

networks:
  home-infra:
    external: true

volumes:
  pgdata:
